[package]
name = "cf-gears-llm-gateway-demo"
description = "End-to-end demo wiring the llm-gateway, provider-plugin, and model-registry SDK traits with mock implementations"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "llm-gateway-demo"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
llm-gateway-sdk = { package = "cf-gears-llm-gateway-sdk", path = "../llm-gateway-sdk" }
model-registry-sdk = { package = "cf-gears-model-registry-sdk", path = "../../model-registry/model-registry-sdk" }
toolkit-security = { workspace = true }
toolkit-odata = { workspace = true }
gts = { workspace = true }
serde_json = { workspace = true }
async-trait = { workspace = true }
futures = { workspace = true }
tokio = { workspace = true }
uuid = { workspace = true }
