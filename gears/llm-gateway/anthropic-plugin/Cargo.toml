[package]
name = "cf-gears-llm-gateway-anthropic-plugin"
description = "LLM Gateway provider plugin for the Anthropic Messages API"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
readme = "README.md"
keywords = ["constructorfabric", "cf-gears"]
categories = ["web-programming"]
metadata.docs.rs.all-features = true

[lib]
name = "anthropic_plugin"
path = "src/lib.rs"

[lints]
workspace = true

[dependencies]
llm-gateway-sdk = { package = "cf-gears-llm-gateway-sdk", version = "0.3.1", path = "../llm-gateway-sdk" }
model-registry-sdk = { package = "cf-gears-model-registry-sdk", version = "0.2.0", path = "../../model-registry/model-registry-sdk" }
oagw-sdk = { workspace = true }
toolkit-canonical-errors = { workspace = true }
toolkit-security = { workspace = true }
gts = { workspace = true }
toolkit-gts = { workspace = true }
schemars = { workspace = true }
async-trait = { workspace = true }
bytes = { workspace = true }
futures = { workspace = true }
http = { workspace = true }
rust_decimal = { workspace = true }
secrecy = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }

[dev-dependencies]
uuid = { workspace = true }
