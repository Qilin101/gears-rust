[package]
name = "cf-gears-account-management-tests"
version = "0.5.2"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Integration test suite for the Account Management gear (not published)"
publish = false

[lints]
workspace = true

[features]
# Gates the Postgres-backed real-DB integration tests. Disabled by
# default because they spin up a `testcontainers` Docker container
# per test; enable with `--features integration` when Docker is
# available locally or in CI.
integration = []

[dev-dependencies]
# The gear under test, plus its public SDK surface.
account-management = { workspace = true }
account-management-sdk = { workspace = true }

toolkit = { workspace = true }
toolkit-db = { workspace = true, features = ["sqlite", "pg"] }
toolkit-gts = { workspace = true }
toolkit-odata = { workspace = true, features = ["with-utoipa"] }
toolkit-security = { workspace = true }
types-registry-sdk = { workspace = true, features = ["test-util"] }
authz-resolver-sdk = { workspace = true }
gts = { workspace = true }

axum = { workspace = true, features = ["macros"] }
utoipa = { workspace = true, features = ["time"] }
# In-process `Router::oneshot` HTTP harness for the REST integration
# suite (`tests/api_*_test.rs`). Mirrors the resource-group gear's
# wiring.
tower = { workspace = true }
http-body-util = { workspace = true }

sea-orm = { workspace = true }
sea-orm-migration = { workspace = true }

anyhow = { workspace = true }
async-trait = { workspace = true }
# Synchronous `Mutex` guarding the in-memory IdP fixture's user map;
# no critical section spans an `.await`.
parking_lot = { workspace = true }
serde_json = { workspace = true }
time = { workspace = true }
uuid = { workspace = true, features = ["v4", "serde"] }

tokio = { workspace = true, features = ["macros", "rt", "test-util"] }
tokio-util = { workspace = true }

# Postgres bring-up for the integration suite. Pulled in
# unconditionally because `[dev-dependencies]` cannot be made
# `optional`, but every reference to these crates is gated behind
# `#[cfg(feature = "integration")]` so a default `cargo test` does
# not require Docker.
testcontainers = { workspace = true }
testcontainers-modules = { workspace = true }
