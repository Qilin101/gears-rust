[package]
name = "cf-gears-model-registry"
version = "0.1.0"
publish = false
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Model Registry gear: tenant-aware catalog of AI providers and models"
repository.workspace = true
readme = "README.md"
keywords = ["constructorfabric", "cf-gears", "model-registry"]
categories = ["web-programming"]

[lib]
name = "model_registry"

[lints]
workspace = true

[dependencies]
model-registry-sdk = { package = "cf-gears-model-registry-sdk", version = "0.1.0", path = "../model-registry-sdk" }

# System SDKs and the gears `deps` names
tenant-resolver-sdk = { workspace = true }
authz-resolver-sdk = { workspace = true }
types-registry-sdk = { workspace = true }
tenant-resolver = { workspace = true }
authz-resolver = { workspace = true }
types-registry = { workspace = true }

# Toolkit framework
toolkit = { workspace = true }
toolkit-db = { workspace = true, features = ["sqlite"] }
toolkit-db-macros = { workspace = true }
toolkit-security = { workspace = true }
toolkit-odata = { workspace = true, features = ["with-utoipa"] }
toolkit-canonical-errors = { workspace = true, features = ["axum"] }
toolkit-macros = { workspace = true }
toolkit-gts = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }
schemars = { workspace = true }
utoipa = { workspace = true }

# Web framework
axum = { workspace = true, features = ["macros"] }

# Database
sea-orm = { workspace = true }
sea-orm-migration = { workspace = true }

# Time & identity
uuid = { workspace = true, features = ["v7"] }
chrono = { workspace = true }

# GTS and settings validation
gts = { workspace = true }
jsonschema = { workspace = true }

# Async & error handling
async-trait = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["sync", "time"] }

# Chain cache
lru = { workspace = true }
rand = { workspace = true }

# Validation
url = { workspace = true }

# Observability
tracing = { workspace = true }

# Gear registration
inventory = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time", "test-util"] }
